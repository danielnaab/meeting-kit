summary: Brief today's work meetings (meeting-kit.yaml
  windmill.schedules.workdayStart)
args:
  calendar: "{{calendar_id}}"
  calendar_mcp_url: "{{calendar_mcp_url}}"
  dry_run: 'false'
cron_version: v2
email: superadmin_secret@windmill.dev
enabled: true
is_flow: true
labels:
  - workday_start
no_flow_overlap: true
schedule: "{{schedule_workday_start}}"
script_path: f/meeting_kit/workday_start
timezone: "{{timezone}}"
ws_error_handler_muted: false
