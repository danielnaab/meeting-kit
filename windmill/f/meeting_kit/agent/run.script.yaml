summary: The meeting agent runner - one `meeting-kit run <agent>` on the agent
  worker
description: The Windmill adapter for meeting-kit's runner, which runs from the
  repository's checkout mounted on the agent worker. See windmill/README.md in
  the repository.
lock: ''
kind: script
labels:
  - agent
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    agent:
      type: string
      description: Which meeting agent to run
      default: null
      enum:
        - meeting-synthesis
        - meeting-triage
        - meeting-briefing
      originalType: enum
    meeting:
      type: string
      description: "meeting-briefing: the meeting, by its ID from `meeting-kit
        meetings` (<date>/<uid>)"
      default: ''
      originalType: string
    why:
      type: string
      description: "meeting-briefing: one line on why the meeting gets a
        briefing (optional)"
      default: ''
      originalType: string
    input:
      type: string
      description: "meeting-triage: the runner's --input, the calendar gate's day
        as JSON (optional)"
      default: ''
      originalType: string
    dry_run:
      type: string
      description: "'true' stops after the runner's --dry-run (prompt and claude
        args, no model, no push)"
      default: 'false'
      enum:
        - 'false'
        - 'true'
      originalType: enum
  required:
    - agent
tag: agent
timeout: 5400
